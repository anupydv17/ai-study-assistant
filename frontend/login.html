<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — AI Study Assistant</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="card">
      <h1>Welcome back</h1>
      <p class="subtitle">Log in to reach your notes.</p>

      <p id="message" class="message" hidden></p>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
        </div>

        <button id="submit-button" type="submit">Log in</button>
      </form>

      <p class="card-footer">
        No account yet? <a href="register.html">Create one</a>
      </p>
    </main>

    <script type="module" src="js/login-page.js"></script>
  </body>
</html>
