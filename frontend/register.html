<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create account — AI Study Assistant</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="auth-page">
    <main class="card">
      <h1>Create your account</h1>
      <p class="subtitle">Turn your PDF notes into summaries, quizzes and flashcards.</p>

      <!-- Filled in by JavaScript. `hidden` keeps it out of the page until needed. -->
      <p id="message" class="message" hidden></p>

      <!-- novalidate turns off the browser's own popups so our messages are
           the only ones the user sees. The backend validates regardless. -->
      <form id="register-form" novalidate>
        <div class="field">
          <label for="full_name">Full name</label>
          <input id="full_name" name="full_name" type="text" autocomplete="name" required />
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required />
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="new-password"
            required
          />
          <p class="hint">At least 8 characters.</p>
        </div>

        <button id="submit-button" type="submit">Create account</button>
      </form>

      <p class="card-footer">
        Already have an account? <a href="login.html">Log in</a>
      </p>
    </main>

    <!-- type="module" is required for `import` to work. -->
    <script type="module" src="js/register-page.js"></script>
  </body>
</html>
